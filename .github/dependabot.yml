version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, python]
    open-pull-requests-limit: 10
    groups:
      routine:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /deployment/renewer
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    open-pull-requests-limit: 10

# deployment/unifi/Dockerfile uses ARG UNIFI_IMAGE followed by FROM ${UNIFI_IMAGE}.
# Dependabot does not update Docker images referenced through ARG, so the reviewed
# test baseline remains explicitly digest-pinned in deployment CI.
